name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        # The site is served from https://<user>.github.io/<repo-name>/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      # Outside Lovable, the build writes the static site (prerendered HTML,
      # CSS, JS, images) to .output/public.
      - name: Check prerendered pages
        run: |
          for page in "" about tutoring integralglobals campus-chaos writing leadership music contact; do
            test -f ".output/public/${page:+$page/}index.html" || { echo "Missing page: /$page"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
